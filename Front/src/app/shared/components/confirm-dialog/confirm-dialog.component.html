<p-dialog [(visible)]="visible" [modal]="true" [closable]="false" [showHeader]="false" styleClass="custom-confirm-dialog-wrapper" [style]="{width: '360px'}">
  <div class="flex flex-col items-center p-6 bg-slate-900 border border-slate-700/50 rounded-2xl text-center select-none shadow-2xl">
    <!-- Icon / Warning -->
    <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center mb-4">
      <i class="pi pi-exclamation-triangle text-[22px] flex items-center justify-center"></i>
    </div>
    <!-- Header -->
    <h3 class="text-sm font-bold text-slate-100 mb-1.5 uppercase tracking-wide">{{ options?.header || 'Confirmar acción' }}</h3>
    <!-- Message -->
    <p class="text-xs text-slate-400 mb-5 leading-relaxed max-w-[280px]">{{ options?.message }}</p>
    <!-- Buttons -->
    <div *ngIf="options?.inputLabel" class="w-full text-left mb-5">
      <label for="confirm-reason" class="block text-sm text-slate-200 mb-2">{{ options?.inputLabel }}</label>
      <textarea id="confirm-reason" [(ngModel)]="inputValue" rows="3"
        aria-describedby="confirm-reason-help"
        class="w-full rounded-lg border border-slate-600 bg-slate-800 text-white p-3 text-sm select-text"></textarea>
      <p id="confirm-reason-help" class="text-xs text-slate-400 mt-2">Escriba al menos {{ options?.inputMinLength || 1 }} caracteres.</p>
    </div>
    <div class="flex items-center space-x-3 w-full">
      <button (click)="reject()" 
        class="flex-grow py-2 px-4 text-xs font-semibold text-slate-300 hover:text-slate-100 bg-slate-800 hover:bg-slate-700/80 rounded-lg border border-slate-700 transition-all cursor-pointer focus:outline-none">
        {{ options?.rejectLabel || 'Cancelar' }}
      </button>
      <button (click)="accept()" [disabled]="!inputValid"
        class="flex-grow py-2 px-4 text-xs font-semibold text-white bg-red-600 hover:bg-red-500 rounded-lg transition-all cursor-pointer shadow-md shadow-red-600/20 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
        {{ options?.acceptLabel || 'Confirmar' }}
      </button>
    </div>
  </div>
</p-dialog>
