<div class="bg-white rounded-lg shadow-md p-6">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Categorías de Egresos</h1>
        <p-button label="Nueva Categoría" icon="pi pi-plus" (click)="openNew()" styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer"></p-button>
    </div>

    <app-custom-table [data]="(categories$ | async) || []" [columns]="cols" tableTitle="Listado de Categorías"
        [showIndex]="true" [globalFilterFields]="['name', 'description']" [actions]="actions">
    </app-custom-table>

    <!-- Modal de Registro/Edición -->
    <p-dialog [(visible)]="displayDialog" [header]="dialogTitle" [modal]="true" [style]="{ width: '500px' }"
        styleClass="custom-dialog bg-white rounded-3xl overflow-hidden shadow-2xl border-none"
        [draggable]="false" [resizable]="false">

        <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="flex flex-col gap-4">

            <div class="flex flex-col gap-2 mt-2">
                <label for="name" class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nombre de la Categoría <span class="text-red-500">*</span></label>
                <input type="text" pInputText id="name" formControlName="name"
                    class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all"
                    placeholder="Ej: Sueldos, Energía Eléctrica..." autocomplete="off" />
                <small class="text-red-500"
                    *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
                    Requerido (máx. 100 caracteres).
                </small>
            </div>

            <div class="flex flex-col gap-2">
                <label for="description" class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Descripción (Opcional)</label>
                <textarea id="description" pInputTextarea formControlName="description" rows="3"
                    class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all resize-none"
                    placeholder="Detalle adicional de la categoría..."></textarea>
            </div>

            <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-slate-100">
                <p-button label="Cancelar" type="button" [text]="true"
                    styleClass="p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !px-3 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer"
                    (click)="onCancel()"></p-button>
                <p-button label="Guardar" type="submit" [disabled]="categoryForm.invalid"
                    styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer disabled:opacity-30"></p-button>
            </div>
        </form>
    </p-dialog>
</div>
