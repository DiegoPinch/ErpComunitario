<div class="bg-white rounded-lg shadow-md p-6">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Gestión de Cuentas</h1>
        <p-button label="Nueva Cuenta" icon="pi pi-plus" severity="success" (click)="openNew()"></p-button>
    </div>

    <app-custom-table [data]="(accounts$ | async) || []" [columns]="cols" title="Listado de Cuentas" [showIndex]="true"
        [globalFilterFields]="['bank_name', 'account_number', 'account_type']" [actions]="actions">
    </app-custom-table>

    <!-- Modal de Cuenta -->
    <p-dialog [(visible)]="accountDialog" [header]="dialogTitle" [modal]="true" [style]="{ width: '50vw' }"
        [breakpoints]="{ '960px': '75vw', '640px': '90vw' }">
        
        <form [formGroup]="accountForm" (ngSubmit)="saveAccount()" class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="bank_name" class="font-semibold text-gray-700">Institución Financiera</label>
                    <p-select [options]="ecuadorBanks" formControlName="bank_name" inputId="bank_name" appendTo="body" placeholder="Seleccione un Banco" styleClass="w-full" [filter]="true" filterBy="label"></p-select>
                    <small *ngIf="accountForm.get('bank_name')?.invalid && accountForm.get('bank_name')?.touched" class="text-red-500">
                        La institución es requerida.
                    </small>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label for="account_number" class="font-semibold text-gray-700">Número de Cuenta</label>
                    <input pInputText id="account_number" formControlName="account_number" placeholder="Ej: 1234567890" />
                    <small *ngIf="accountForm.get('account_number')?.invalid && accountForm.get('account_number')?.touched" class="text-red-500">
                        El número de cuenta es requerido.
                    </small>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="account_type" class="font-semibold text-gray-700">Tipo de Cuenta</label>
                    <p-select [options]="accountTypes" formControlName="account_type" inputId="account_type" appendTo="body" styleClass="w-full"></p-select>
                </div>

                <div class="flex flex-col gap-2" *ngIf="!isEdit">
                    <label for="initial_balance" class="font-semibold text-gray-700">Saldo Inicial</label>
                    <p-inputNumber id="initial_balance" formControlName="initial_balance" mode="currency" currency="USD" locale="en-US" styleClass="w-full"></p-inputNumber>
                </div>

                <div class="flex flex-col gap-2" *ngIf="isEdit">
                    <label for="status" class="font-semibold text-gray-700">Estado</label>
                    <p-select [options]="statusOptions" formControlName="status" inputId="status" appendTo="body" styleClass="w-full"></p-select>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-100">
                <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (click)="hideDialog()"></p-button>
                <p-button label="Guardar" icon="pi pi-check" type="submit" severity="success" [disabled]="accountForm.invalid"></p-button>
            </div>
        </form>
    </p-dialog>
</div>
