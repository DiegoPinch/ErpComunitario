<div class="container mx-auto p-4 relative">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 md:mb-0">Cuentas por Cobrar </h1>
        
        <div class="flex items-center space-x-4">
            <button (click)="showForm = !showForm" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
                {{ showForm ? 'Cancelar' : 'Registrar Deuda / Saldo Anterior' }}
            </button>
        </div>
    </div>

    <!-- Modal/Formulario para registrar deuda nueva -->
    <div *ngIf="showForm" class="bg-white shadow-lg rounded-lg px-8 pt-6 pb-8 mb-6 border-l-4 border-blue-500">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Registrar Nueva Cuenta por Cobrar</h2>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Usuario (Cliente)</label>
                    <select formControlName="user_id" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                        <option value="">Seleccione un usuario...</option>
                        <option *ngFor="let u of users" [value]="u.user_id">{{ u.last_name }} {{ u.first_name }} - {{ u.national_id }}</option>
                    </select>
                </div>
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Concepto / Descripción (Ej: Deuda Histórica, Instalación)</label>
                    <input formControlName="description" type="text" class="shadow appearance-none border rounded w-full py-2 px-3">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Monto Total de la Deuda ($)</label>
                    <input formControlName="total_amount" type="number" step="0.01" class="shadow appearance-none border rounded w-full py-2 px-3">
                </div>
            </div>
            
            <button type="submit" [disabled]="form.invalid" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50 mt-4">
                Guardar Deuda
            </button>
        </form>
    </div>

    <!-- Modal para realizar un abono -->
    <div *ngIf="showPaymentForm" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-xl w-96">
            <h3 class="text-lg font-bold mb-2">Registrar Abono</h3>
            <p class="text-sm text-gray-600 mb-4">{{ selectedDebtName }}</p>
            
            <form [formGroup]="paymentForm" (ngSubmit)="onPaymentSubmit()">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Monto a Abonar ($)</label>
                    <input formControlName="amount_paid" type="number" step="0.01" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3">

                    <label class="block text-gray-700 text-sm font-bold mb-2">Método de Pago</label>
                    <p-select [options]="paymentMethods" formControlName="payment_method" styleClass="w-full mb-3" appendTo="body"></p-select>

                    <div *ngIf="paymentForm.get('payment_method')?.value !== 'cash'">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Cuenta Bancaria</label>
                        <p-select [options]="activeAccounts" formControlName="account_id" placeholder="Seleccione la cuenta" styleClass="w-full mb-3" appendTo="body"></p-select>

                        <label class="block text-gray-700 text-sm font-bold mb-2">No. de Comprobante</label>
                        <input formControlName="reference_number" type="text" placeholder="Ej: 0023451" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3">
                    </div>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" (click)="showPaymentForm = false" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Cancelar</button>
                    <button type="submit" [disabled]="paymentForm.invalid" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded disabled:opacity-50">Confirmar Pago</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para ver Historial de Pagos -->
    <div *ngIf="showHistoryModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Historial de Pagos</h3>
                <button (click)="showHistoryModal = false" class="text-gray-500 hover:text-gray-800">
                    <i class="pi pi-times text-xl"></i>
                </button>
            </div>
            <p class="text-sm text-gray-600 mb-4">{{ selectedDebtName }}</p>
            
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-2 px-4 border-b text-left text-sm font-semibold text-gray-700">Fecha</th>
                            <th class="py-2 px-4 border-b text-left text-sm font-semibold text-gray-700">Monto ($)</th>
                            <th class="py-2 px-4 border-b text-center text-sm font-semibold text-gray-700">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let payment of historyPayments" class="hover:bg-gray-50">
                            <td class="py-2 px-4 border-b text-sm text-gray-800">{{ payment.payment_date | date:'short' }}</td>
                            <td class="py-2 px-4 border-b text-sm font-bold text-green-600">${{ payment.amount_paid | number:'1.2-2' }}</td>
                            <td class="py-2 px-4 border-b text-center">
                                <button (click)="printHistoryTicket(payment)" class="text-blue-500 hover:text-blue-700" title="Imprimir Ticket">
                                    <i class="pi pi-print"></i> Imprimir
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="historyPayments.length === 0">
                            <td colspan="3" class="py-4 text-center text-sm text-gray-500 italic">No hay pagos registrados para esta deuda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="bg-white shadow-md rounded my-6 p-4">
        <app-custom-table 
            [data]="agreements" 
            [columns]="columns" 
            title="Deudas y Cargos" 
            [globalFilterFields]="['client_name', 'description']"
            [actions]="actions">
        </app-custom-table>
    </div>
</div>
