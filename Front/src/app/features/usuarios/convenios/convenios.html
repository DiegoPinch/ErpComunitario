<p-toast />
<div class="container mx-auto p-4 relative">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 md:mb-0">Cuentas por Cobrar </h1>
        
        <div class="flex items-center space-x-4">
            <button (click)="openCreateModal()" class="!bg-primary hover:!bg-primary/90 text-white font-semibold py-1.5 px-3 rounded-lg shadow-sm text-xs transition-all cursor-pointer">
                Registrar Deuda / Saldo Anterior
            </button>
        </div>
    </div>

    <!-- Formulario para registrar deuda nueva -->
    <p-dialog [(visible)]="showForm" [modal]="true" header="Registrar Nueva Cuenta por Cobrar"
        [style]="{width: '600px', maxWidth: '95vw'}" styleClass="custom-dialog"
        [draggable]="false" [resizable]="false" [closable]="!isCreating" [closeOnEscape]="!isCreating">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-slate-500 text-xs font-semibold mb-2">Usuario (Cliente) <span class="text-red-500">*</span></label>
                    <p-select formControlName="user_id" [options]="users"
                        optionLabel="display_name" optionValue="user_id"
                        [filter]="true" filterBy="display_name" [showClear]="true"
                        placeholder="Seleccione un usuario..." filterPlaceholder="Buscar usuario..."
                        emptyFilterMessage="No se encontraron usuarios" emptyMessage="No hay usuarios disponibles"
                        appendTo="body" styleClass="w-full" [style]="{width: '100%'}">
                    </p-select>
                </div>
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-slate-500 text-xs font-semibold mb-2">Concepto / Descripción (Ej: Deuda Histórica, Instalación) <span class="text-red-500">*</span></label>
                    <input formControlName="description" type="text" class="w-full px-3 py-2 text-sm text-slate-700 bg-white border border-slate-300 focus:border-primary focus:ring-1 focus:ring-primary rounded-lg outline-none transition-all">
                </div>
                <div>
                    <label class="block text-slate-500 text-xs font-semibold mb-2">Monto Total de la Deuda ($) <span class="text-red-500">*</span></label>
                    <p-inputNumber formControlName="total_amount" mode="decimal" locale="en-US"
                        [format]="true" (onFocus)="onDebtAmountFocus($event)"
                        [minFractionDigits]="2" [maxFractionDigits]="2" [useGrouping]="true"
                        [showButtons]="false" placeholder="0.00" styleClass="w-full" inputStyleClass="w-full">
                    </p-inputNumber>
                    <p *ngIf="form.get('total_amount')?.touched && form.get('total_amount')?.invalid" class="text-xs text-red-600 mt-2">Ingrese un monto desde $0.01.</p>
                </div>
            </div>
            
            <p *ngIf="createError" role="alert" class="text-sm text-red-700 mb-3">{{ createError }}</p>
            <div class="flex justify-end gap-3 pt-4 mt-4">
                <button type="button" (click)="showForm = false" [disabled]="isCreating"
                    class="px-4 py-2 rounded-lg text-slate-600 border border-slate-300 disabled:opacity-50">Cancelar</button>
                <button type="submit" [disabled]="form.invalid || isCreating" class="!bg-primary hover:!bg-primary/90 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition-all cursor-pointer disabled:opacity-30">
                    {{ isCreating ? 'Guardando...' : 'Guardar Deuda' }}
                </button>
            </div>
        </form>
    </p-dialog>

    <!-- Diálogo para realizar un abono -->
    <p-dialog [(visible)]="showPaymentForm" [modal]="true" header="Registrar Abono" [style]="{width: '400px'}"
        styleClass="custom-dialog bg-white rounded-3xl overflow-hidden shadow-2xl border-none"
        [draggable]="false" [resizable]="false" [closable]="true">
        
        <div class="flex flex-col gap-4 p-4 pt-1">
            <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-2">{{ selectedDebtName }}</p>
            
            <form [formGroup]="paymentForm" (ngSubmit)="onPaymentSubmit()" class="space-y-4">
                <div>
                    <label class="block text-slate-400 text-[10px] font-black uppercase tracking-widest ml-1 mb-2">Monto a Abonar</label>
                    <div class="relative w-full">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold">$</span>
                        <input type="text" inputmode="numeric"
                            [value]="formattedPaymentAmount"
                            (input)="onPaymentAmountInput($event)"
                            (blur)="onPaymentAmountBlur($event)"
                            class="w-full pl-7 pr-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none font-bold transition-all">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="block text-slate-400 text-[10px] font-black uppercase tracking-widest ml-1">Método de Pago</label>
                    <p-select [options]="paymentMethods" formControlName="payment_method" styleClass="w-full" appendTo="body"></p-select>
                </div>

                <div *ngIf="paymentForm.get('payment_method')?.value !== 'cash'" class="space-y-4">
                    <div class="flex flex-col gap-2">
                        <label class="block text-slate-400 text-[10px] font-black uppercase tracking-widest ml-1">Cuenta Bancaria</label>
                        <p-select [options]="activeAccounts" formControlName="account_id" placeholder="Seleccione la cuenta" styleClass="w-full" appendTo="body"></p-select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="block text-slate-400 text-[10px] font-black uppercase tracking-widest ml-1">No. de Comprobante / Referencia</label>
                        <input formControlName="reference_number" type="text" placeholder="Ej: 0023451" 
                            class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                    </div>
                </div>

                <!-- Acciones -->
                <div class="flex flex-col gap-2 pt-3">
                    <p-button type="submit" [disabled]="paymentForm.invalid || isPaymentSubmitting"
                        [label]="isPaymentSubmitting ? 'Procesando...' : 'Confirmar Pago'" icon="pi pi-check"
                        styleClass="w-full !bg-primary hover:!bg-primary/90 !text-white !border-none !py-2.5 !text-xs !font-semibold rounded-lg shadow-sm transition-all duration-150 cursor-pointer disabled:opacity-30">
                    </p-button>
                    <p-button (click)="showPaymentForm = false" label="Cancelar" [text]="true"
                        styleClass="w-full p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer">
                    </p-button>
                </div>
            </form>
        </div>
    </p-dialog>

    <!-- Diálogo de Historial de Pagos -->
    <p-dialog [(visible)]="showHistoryModal" [modal]="true" [header]="'Historial de Pagos'"
        [style]="{width: '85vw', 'max-width': '650px'}" styleClass="custom-dialog" [draggable]="false" [resizable]="false" [closable]="true">
        
        <div class="flex flex-col gap-3 pt-1">
            <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-2 px-1">{{ selectedDebtName }}</p>
            
            <div class="overflow-hidden border border-slate-100 rounded-xl bg-white shadow-sm max-h-[350px] overflow-y-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 border-b border-slate-100 sticky top-0 z-10">
                        <tr>
                            <th class="px-4 py-3 font-bold text-slate-400 uppercase tracking-wider">Fecha</th>
                            <th class="px-4 py-3 text-right font-bold text-slate-400 uppercase tracking-wider">Monto</th>
                            <th class="px-4 py-3 text-center font-bold text-slate-400 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr *ngFor="let payment of historyPayments" class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-4 py-3 text-slate-600">
                                {{ payment.payment_date | date:'short' }}
                            </td>
                            <td class="px-4 py-3 text-right font-bold text-green-600">
                                ${{ payment.amount_paid | number:'1.2-2' }}
                            </td>
                            <td class="px-4 py-3 text-center">
                                <p-button (click)="printHistoryTicket(payment)" label="Imprimir Ticket" icon="pi pi-print" [text]="true"
                                    styleClass="p-button-outlined !text-slate-600 hover:!bg-slate-50 !border-slate-300 !py-1 !px-2.5 !text-[10px] !font-semibold rounded-md shadow-sm transition-all duration-150 cursor-pointer">
                                </p-button>
                                <p-button (click)="voidHistoryPayment(payment)" label="Anular" icon="pi pi-ban" [text]="true" [disabled]="isVoiding"
                                    styleClass="!text-red-600 hover:!bg-red-50 !py-1 !px-2.5 !text-[10px] !font-semibold rounded-md">
                                </p-button>
                            </td>
                        </tr>
                        <tr *ngIf="historyPayments.length === 0">
                            <td colspan="3" class="py-8 text-center text-xs text-slate-400 italic">No hay pagos registrados para esta deuda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <ng-template pTemplate="footer">
            <div class="flex justify-end pt-2 pb-1 mt-1">
                <p-button (click)="showHistoryModal = false" label="Cerrar"
                    styleClass="p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !px-3 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer">
                </p-button>
            </div>
        </ng-template>
    </p-dialog>

    <div class="bg-white shadow-md rounded my-6 p-4">
        <app-custom-table 
            [data]="agreements" 
            [columns]="columns" 
            tableTitle="Deudas y Cargos" 
            [globalFilterFields]="['client_name', 'description']"
            [actions]="actions">
        </app-custom-table>
    </div>
</div>
