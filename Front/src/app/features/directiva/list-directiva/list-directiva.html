<div class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Administración (Directivas)</h1>
        <button (click)="openNew()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Nueva Directiva
        </button>
    </div>

    <app-custom-table 
        [data]="administrations" 
        [columns]="columns" 
        [actions]="actions"
        [globalFilterFields]="['name']">
    </app-custom-table>
</div>

<!-- Modal Formulario -->
<p-dialog [(visible)]="showForm" [style]="{width: '50vw', minWidth: '400px'}" [header]="isEditMode ? 'Editar Directiva' : 'Nueva Directiva'" [modal]="true" styleClass="p-fluid">
    <ng-template pTemplate="content">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mb-4 mt-2">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nombre del Período / Directiva</label>
                <input formControlName="name" type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Ej: Período 2026-2027">
            </div>

            <div class="flex flex-wrap -mx-3 mb-4">
                <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Fecha Inicio</label>
                    <input formControlName="start_date" type="date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="w-full md:w-1/2 px-3">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Fecha Fin (Opcional)</label>
                    <input formControlName="end_date" type="date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Estado</label>
                <select formControlName="status" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="active">Activa</option>
                    <option value="completed">Completada</option>
                </select>
            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-primary" (click)="onSubmit()" [disabled]="form.invalid"></button>
    </ng-template>
</p-dialog>

<!-- Modal Integrantes / Miembros de Directiva -->
<p-dialog [(visible)]="showMembers" [style]="{width: '60vw', minWidth: '500px'}" [header]="'Integrantes de la Directiva: ' + selectedAdminName" [modal]="true">
    <div class="p-4">
        <!-- Formulario para agregar integrante -->
        <div class="bg-gray-50 border border-gray-200 rounded p-4 mb-6">
            <h3 class="font-semibold text-gray-700 mb-3 text-sm">Agregar Nuevo Integrante</h3>
            <form [formGroup]="memberForm" (ngSubmit)="addMember()" class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                <div>
                    <label class="block text-gray-600 text-xs font-bold mb-1">Usuario / Socio</label>
                    <select formControlName="user_id" class="shadow appearance-none border rounded w-full py-1.5 px-3 text-gray-700 text-sm focus:outline-none bg-white">
                        <option [value]="null">Seleccione...</option>
                        <option *ngFor="let u of users" [value]="u.user_id">
                            {{u.last_name}} {{u.first_name}} ({{u.national_id}})
                        </option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 text-xs font-bold mb-1">Cargo / Rol</label>
                    <select formControlName="role" class="shadow appearance-none border rounded w-full py-1.5 px-3 text-gray-700 text-sm focus:outline-none bg-white">
                        <option value="PRESIDENTE">PRESIDENTE</option>
                        <option value="TESORERO">TESORERO</option>
                        <option value="SECRETARIA">SECRETARIA</option>
                        <option value="VOCAL 1">VOCAL 1</option>
                        <option value="VOCAL 2">VOCAL 2</option>
                    </select>
                </div>
                <div>
                    <button type="submit" [disabled]="memberForm.invalid" class="bg-green-600 hover:bg-green-700 text-white font-bold py-1.5 px-4 rounded w-full text-sm flex items-center justify-center gap-1">
                        <i class="pi pi-plus"></i> Agregar
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabla de Integrantes Activos -->
        <h3 class="font-bold text-gray-800 mb-2">Miembros Actuales</h3>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 text-sm rounded">
                <thead>
                    <tr class="bg-gray-100 border-b">
                        <th class="py-2 px-4 text-left font-semibold text-gray-700">Cargo</th>
                        <th class="py-2 px-4 text-left font-semibold text-gray-700">Nombre</th>
                        <th class="py-2 px-4 text-left font-semibold text-gray-700">Cédula</th>
                        <th class="py-2 px-4 text-center font-semibold text-gray-700">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let m of members" class="border-b hover:bg-gray-50">
                        <td class="py-2 px-4 font-semibold text-gray-800">{{m.role}}</td>
                        <td class="py-2 px-4 text-gray-700">{{m.first_name}} {{m.last_name}}</td>
                        <td class="py-2 px-4 text-gray-600">{{m.national_id}}</td>
                        <td class="py-2 px-4 text-center">
                            <button type="button" (click)="removeMember(m.board_id)" class="text-red-600 hover:text-red-800 font-bold p-1">
                                <i class="pi pi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="members.length === 0">
                        <td colspan="4" class="py-4 text-center text-gray-500 italic">No hay integrantes registrados en esta directiva.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</p-dialog>
