<div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Administración (Directivas)</h1>
        <p-button label="Nueva Directiva" icon="pi pi-plus" (click)="openNew()"
            styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer"></p-button>
    </div>

    <app-custom-table 
        [data]="administrations" 
        [columns]="columns" 
        [actions]="actions"
        tableTitle="Listado de Directivas"
        [globalFilterFields]="['name']">
    </app-custom-table>
</div>

<!-- Modal Formulario -->
<p-dialog [(visible)]="showForm" [style]="{width: '500px'}" styleClass="custom-dialog bg-white rounded-3xl overflow-hidden shadow-2xl border-none" [header]="isEditMode ? 'Editar Directiva' : 'Nueva Directiva'" [modal]="true" [draggable]="false" [resizable]="false">
    <ng-template pTemplate="content">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-2">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nombre del Período / Directiva <span class="text-red-500">*</span></label>
                <input formControlName="name" type="text" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all" placeholder="Ej: Período 2026-2027">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Fecha Inicio <span class="text-red-500">*</span></label>
                    <input formControlName="start_date" type="date" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Fecha Fin (Opcional)</label>
                    <input formControlName="end_date" type="date" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Estado</label>
                <select formControlName="status" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                    <option value="active">Activa</option>
                    <option value="completed">Completada</option>
                </select>
            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <p-button label="Cancelar" type="button" [text]="true"
                styleClass="p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !px-3 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer"
                (click)="hideDialog()"></p-button>
            <p-button label="Guardar" type="submit" [disabled]="form.invalid"
                styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer disabled:opacity-30"
                (click)="onSubmit()"></p-button>
        </div>
    </ng-template>
</p-dialog>

<!-- Modal Integrantes / Miembros de Directiva -->
<p-dialog [(visible)]="showMembers" [style]="{width: '700px'}" styleClass="custom-dialog bg-white rounded-3xl overflow-hidden shadow-2xl border-none" [header]="'Integrantes de la Directiva: ' + selectedAdminName" [modal]="true" [draggable]="false" [resizable]="false">
    <div class="flex flex-col gap-6 pt-2">
        <!-- Formulario para agregar integrante -->
        <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Agregar Nuevo Integrante</h3>
            <form [formGroup]="memberForm" (ngSubmit)="addMember()" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
                <div class="md:col-span-6 flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Usuario / Socio</label>
                    <select formControlName="user_id" class="w-full px-3 py-1.5 text-xs text-slate-700 bg-white border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-lg outline-none transition-all">
                        <option [value]="null">Seleccione...</option>
                        <option *ngFor="let u of users" [value]="u.user_id">
                            {{u.last_name}} {{u.first_name}} ({{u.national_id}})
                        </option>
                    </select>
                </div>
                <div class="md:col-span-4 flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Cargo / Rol</label>
                    <select formControlName="role" class="w-full px-3 py-1.5 text-xs text-slate-700 bg-white border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-lg outline-none transition-all">
                        <option value="PRESIDENTE">PRESIDENTE</option>
                        <option value="TESORERO">TESORERO</option>
                        <option value="SECRETARIA">SECRETARIA</option>
                        <option value="VOCAL 1">VOCAL 1</option>
                        <option value="VOCAL 2">VOCAL 2</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <p-button type="submit" label="Agregar" [disabled]="memberForm.invalid"
                        styleClass="w-full !bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-2 !text-[11px] !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer disabled:opacity-30 flex justify-center"></p-button>
                </div>
            </form>
        </div>

        <!-- Tabla de Integrantes Activos -->
        <div>
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Miembros Actuales</h3>
            <div class="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-sm">
                <table class="min-w-full text-sm">
                    <thead>
                        <tr>
                            <th class="!bg-slate-50/75 !text-slate-500 !text-[10px] !font-bold !uppercase !tracking-wider !py-3 !px-4 text-left border-b border-slate-200">Cargo</th>
                            <th class="!bg-slate-50/75 !text-slate-500 !text-[10px] !font-bold !uppercase !tracking-wider !py-3 !px-4 text-left border-b border-slate-200">Nombre</th>
                            <th class="!bg-slate-50/75 !text-slate-500 !text-[10px] !font-bold !uppercase !tracking-wider !py-3 !px-4 text-left border-b border-slate-200">Cédula</th>
                            <th class="!bg-slate-50/75 !text-slate-500 !text-[10px] !font-bold !uppercase !tracking-wider !py-3 !px-4 text-center border-b border-slate-200">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let m of members" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="py-2.5 px-4 font-bold text-slate-700 text-xs">{{m.role}}</td>
                            <td class="py-2.5 px-4 text-slate-600 text-xs font-medium">{{m.first_name}} {{m.last_name}}</td>
                            <td class="py-2.5 px-4 text-slate-500 text-xs">{{m.national_id}}</td>
                            <td class="py-2.5 px-4 text-center">
                                <p-button type="button" icon="pi pi-trash" [text]="true"
                                    styleClass="p-button-text !text-red-500 hover:!bg-red-50 !py-1 !px-2 rounded transition-all duration-150 cursor-pointer"
                                    (click)="removeMember(m.board_id)"></p-button>
                            </td>
                        </tr>
                        <tr *ngIf="members.length === 0">
                            <td colspan="4" class="py-6 text-center">
                                <div class="flex flex-col items-center justify-center text-slate-400">
                                    <i class="pi pi-inbox text-2xl mb-2"></i>
                                    <span class="text-xs">No hay integrantes asignados</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100 mt-2">
            <p-button label="Cerrar" type="button" [text]="true"
                styleClass="p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !px-3 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer"
                (click)="showMembers = false"></p-button>
        </div>
    </ng-template>
</p-dialog>
