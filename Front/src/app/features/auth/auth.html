<div class="auth-container">
  <h1>Bienvenido a YakuGest</h1>
  <p>Sistema de gestión para Juntas de Agua Potable</p>

  <div class="login-section">
    <h2>Iniciar Sesión</h2>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" required [disabled]="loading">
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required [disabled]="loading">
      </div>
      <button type="submit" class="login-btn" [disabled]="loading">
        {{ loading ? 'Iniciando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
