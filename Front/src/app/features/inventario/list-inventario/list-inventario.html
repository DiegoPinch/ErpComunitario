<div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Inventario (Bienes y Suministros)</h1>
        <p-button label="Nuevo Ítem" icon="pi pi-plus" (click)="openNew()"
            styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer"></p-button>
    </div>

    <app-custom-table 
        [data]="items" 
        [columns]="columns" 
        [actions]="actions"
        tableTitle="Listado de Inventario"
        [globalFilterFields]="['code', 'name_desc']">
    </app-custom-table>
</div>

<!-- Modal Formulario -->
<p-dialog [(visible)]="showForm" [style]="{width: '600px'}" styleClass="custom-dialog bg-white rounded-3xl overflow-hidden shadow-2xl border-none" [header]="isEditMode ? 'Editar Ítem' : 'Registrar Nuevo Ítem'" [modal]="true" [draggable]="false" [resizable]="false">
    <ng-template pTemplate="content">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-2">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Código <span class="text-red-500">*</span></label>
                    <input formControlName="code" type="text" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all uppercase">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Nombre del Bien/Suministro <span class="text-red-500">*</span></label>
                    <input formControlName="name" type="text" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Categoría <span class="text-red-500">*</span></label>
                    <select formControlName="category" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                        <option value="tools">Herramienta</option>
                        <option value="materials">Material de Construcción</option>
                        <option value="equipment">Equipos/Maquinaria</option>
                        <option value="office">Suministros de Oficina</option>
                        <option value="other">Otro</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Unidad de Medida <span class="text-red-500">*</span></label>
                    <select formControlName="unit_measure" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                        <option value="unit">Unidad(es)</option>
                        <option value="meter">Metro(s)</option>
                        <option value="kg">Kilogramo(s)</option>
                        <option value="liter">Litro(s)</option>
                        <option value="box">Caja(s)</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Descripción</label>
                <input formControlName="description" type="text" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2" *ngIf="!isEditMode">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Stock Inicial <span class="text-red-500">*</span></label>
                    <input formControlName="initial_stock" type="number" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Stock Mínimo (Alerta) <span class="text-red-500">*</span></label>
                    <input formControlName="minimum_stock" type="number" class="w-full px-3 py-2 text-sm text-slate-700 bg-slate-50/50 border border-slate-200 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary rounded-xl outline-none transition-all">
                </div>
            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <p-button label="Cancelar" type="button" [text]="true"
                styleClass="p-button-text !text-slate-500 hover:!bg-slate-100 !py-1.5 !px-3 !text-xs !font-semibold rounded-lg transition-all duration-150 cursor-pointer"
                (click)="showForm = false"></p-button>
            <p-button label="Guardar" type="submit" [disabled]="form.invalid"
                styleClass="!bg-primary hover:!bg-primary/90 !text-white !border-none !py-1.5 !px-3 !text-xs !font-semibold shadow-sm rounded-lg transition-all duration-150 cursor-pointer disabled:opacity-30"
                (click)="onSubmit()"></p-button>
        </div>
    </ng-template>
</p-dialog>
