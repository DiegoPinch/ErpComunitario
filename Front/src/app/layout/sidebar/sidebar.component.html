<aside class="h-full flex flex-col w-full select-none">
  <div class="flex-1 overflow-y-auto py-4 no-scrollbar">
    <ul class="space-y-1 px-3">
      @for (item of items; track item.label) {
        <li>
          @if (item.items) {
            <!-- Submenu Parent Item -->
            <div>
              <button (click)="toggleSubmenu(item)"
                class="w-full flex items-center justify-between px-4 py-2.5 text-sm font-medium rounded-lg text-header-text-muted hover:bg-white/10 hover:text-header-text transition-all duration-150 focus:outline-none cursor-pointer">
                <div class="flex items-center">
                  <i [class]="item.icon + ' w-5 mr-3 text-[17px] flex items-center justify-center'"></i>
                  <span>{{ item.label }}</span>
                </div>
                <i class="pi pi-chevron-down text-[10px] text-header-text-muted transition-transform duration-200"
                  [class.rotate-180]="isExpanded(item)"></i>
              </button>
              
              <!-- Submenu Child Items -->
              @if (isExpanded(item)) {
                <ul class="mt-1 space-y-1 pl-4">
                  @for (subItem of item.items; track subItem.label) {
                    <li>
                      <a [routerLink]="subItem.routerLink" routerLinkActive="bg-white/10 text-header-text font-semibold"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="flex items-center px-4 py-2 text-xs rounded-lg text-header-text-muted hover:bg-white/5 hover:text-header-text transition-all duration-150 cursor-pointer">
                        <i [class]="subItem.icon + ' w-4 mr-2 opacity-70 flex items-center justify-center'"></i>
                        <span>{{ subItem.label }}</span>
                      </a>
                    </li>
                  }
                </ul>
              }
            </div>
          } @else {
            <!-- Single Link Item (e.g. Dashboard) -->
            @if (item.routerLink) {
              <a [routerLink]="item.routerLink" routerLinkActive="bg-white/10 text-header-text font-semibold"
                [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-header-text-muted hover:bg-white/10 hover:text-header-text transition-all duration-150 cursor-pointer">
                <i [class]="item.icon + ' w-5 mr-3 text-[17px] flex items-center justify-center'"></i>
                <span>{{ item.label }}</span>
              </a>
            } @else {
              <!-- Action Button Item (e.g. Cerrar Sesión) -->
              <button (click)="item.command ? item.command({ originalEvent: $event, item: item }) : null"
                class="w-full flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-red-400 hover:bg-red-500/10 transition-all duration-150 focus:outline-none cursor-pointer">
                <i [class]="item.icon + ' w-5 mr-3 text-[17px] text-red-400 flex items-center justify-center'"></i>
                <span>{{ item.label }}</span>
              </button>
            }
          }
        </li>
      }
    </ul>
  </div>
</aside>
