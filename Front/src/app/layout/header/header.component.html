<p-toast></p-toast>

<header class="bg-slate-800 text-white shadow-md border-b border-slate-700">
  <div class="container mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <!-- Logo, Toggle Button y Título -->
      <div class="flex items-center space-x-4">
        <!-- Logo -->
        <img src="logo1.jpg" alt="YakuGest Logo" class="h-10 w-auto object-contain">
        <!-- Título YakuGest -->
        <div class="text-xl font-bold text-slate-100">YakuGest</div>

        <!-- Toggle Sidebar Button -->
        <p-button (onClick)="onToggleSidebar()" icon="pi pi-bars" [text]="true" [rounded]="true" severity="secondary"
          styleClass="p-2 hover:bg-slate-700 transition-colors" pTooltip="Mostrar/Ocultar menú"
          tooltipPosition="bottom">
        </p-button>

      </div>

      <!-- Mensaje de Bienvenida y Usuario -->
      <div class="flex items-center space-x-4">
        <!-- Bienvenido Usuario -->
        <div class="flex items-center space-x-3 select-none">
          <div class="text-sm">
            <span class="text-slate-400 font-normal">Bienvenido, </span>
            <span class="font-semibold text-slate-100">{{ userName }}</span>
          </div>
          <span class="text-[10px] px-2 py-0.5 bg-sky-500/20 text-sky-300 border border-sky-500/30 rounded-full font-bold uppercase tracking-wider">
            {{ userRole }}
          </span>
        </div>

        <!-- Botón de Usuario -->
        <div class="relative">
          <button (click)="toggleUserMenu()"
            class="flex items-center space-x-2 p-2 rounded-lg hover:bg-slate-700 transition-colors">
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
              <span class="text-white text-sm font-medium">{{ userInitials }}</span>
            </div>
            <i class="pi pi-chevron-down text-slate-400 text-xs"></i>
          </button>

          <!-- Menú desplegable -->
          <div *ngIf="showUserMenu"
            class="absolute right-0 top-full mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 z-50">
            <div class="py-2">
              <button (click)="openSettings()"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center space-x-2">
                <i class="pi pi-cog text-gray-500"></i>
                <span>Configuración</span>
              </button>
              <div class="border-t border-gray-200 my-1"></div>
              <button (click)="logout()"
                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center space-x-2">
                <i class="pi pi-sign-out text-red-500"></i>
                <span>Cerrar Sesión</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Diálogo de Perfil / Configuración de Contraseña -->
<p-dialog [(visible)]="displaySettingsDialog" header="Configuración de Cuenta" [modal]="true" [style]="{ width: '400px' }">
  <div class="flex flex-col gap-4 text-gray-800">
    <!-- Información de Usuario (Solo Lectura) -->
    <div class="bg-slate-50 p-4 rounded-lg border border-gray-100 flex flex-col gap-2">
      <div>
        <span class="text-xs text-gray-400 font-semibold uppercase block">Nombre Completo</span>
        <span class="text-sm font-medium text-gray-700">{{ userName }}</span>
      </div>
      <div>
        <span class="text-xs text-gray-400 font-semibold uppercase block">Usuario / Cédula</span>
        <span class="text-sm font-medium text-gray-700">{{ usernameVal }}</span>
      </div>
      <div>
        <span class="text-xs text-gray-400 font-semibold uppercase block">Rol / Cargo</span>
        <span class="text-sm font-medium text-gray-700">{{ userRole }}</span>
      </div>
    </div>

    <!-- Formulario para Cambiar Contraseña -->
    <form [formGroup]="passwordForm" (ngSubmit)="savePassword()" class="flex flex-col gap-3">
      <h3 class="text-sm font-bold text-gray-700 mt-2 border-b border-gray-100 pb-1.5">Cambiar Contraseña</h3>
      
      <!-- Contraseña Anterior -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500">Contraseña Actual</label>
        <input pInputText type="password" formControlName="oldPassword" class="p-inputtext-sm w-full" placeholder="Ingrese clave actual" />
        <small *ngIf="passwordForm.get('oldPassword')?.invalid && passwordForm.get('oldPassword')?.touched" class="text-red-500 text-xs">
          La contraseña actual es obligatoria.
        </small>
      </div>

      <!-- Nueva Contraseña -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500">Nueva Contraseña</label>
        <input pInputText type="password" formControlName="newPassword" class="p-inputtext-sm w-full" placeholder="Mínimo 4 caracteres" />
        <small *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" class="text-red-500 text-xs">
          La nueva contraseña debe tener al menos 4 caracteres.
        </small>
      </div>

      <!-- Confirmar Nueva Contraseña -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-500">Confirmar Nueva Contraseña</label>
        <input pInputText type="password" formControlName="confirmPassword" class="p-inputtext-sm w-full" placeholder="Repita la nueva clave" />
        <small *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched" class="text-red-500 text-xs">
          Las contraseñas nuevas no coinciden.
        </small>
      </div>

      <!-- Botones de Acción -->
      <div class="flex justify-end gap-2 mt-4 pt-3 border-t border-gray-100">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (click)="closeSettings()"></p-button>
        <p-button label="Guardar" icon="pi pi-check" type="submit" severity="info" [disabled]="passwordForm.invalid || loading"></p-button>
      </div>
    </form>
  </div>
</p-dialog>
